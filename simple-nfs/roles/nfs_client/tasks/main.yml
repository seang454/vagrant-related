---
# tasks file for nfs_client
# Equivalent to running these commands on the Slave Server:
#   sudo apt update
#   sudo apt install nfs-common -y
#   sudo mkdir /opt/nfs/data -p
#   sudo chown nobody:nogroup /opt/nfs/data
#   sudo chmod 777 -R /opt/nfs/data
#   sudo mount master-server-ip:/opt/nfs/data /opt/nfs/data

# STEP 1: Install NFS client package
- name: Install nfs-common
  package:
    name: nfs-common
    state: present

# STEP 2: Create mount point directory
- name: Create NFS mount point directory
  file:
    path: "{{ nfs_mount_point }}"
    state: directory
    owner: nobody
    group: nogroup
    mode: '0777'
    recurse: yes

# STEP 3: Wait for NFS server to be reachable
# This prevents the mount from hanging if the server isn't ready yet
- name: Wait for NFS server to be reachable on port 2049
  wait_for:
    host: "{{ nfs_server_ip }}"
    port: 2049
    timeout: 60

# STEP 4: Mount the NFS share and add to /etc/fstab
# This is equivalent to: sudo mount master-server-ip:/opt/nfs/data /opt/nfs/data
# The "mounted" state also adds an entry to /etc/fstab so it persists after reboot
- name: Mount NFS share and add to fstab
  mount:
    path: "{{ nfs_mount_point }}"
    src: "{{ nfs_server_ip }}:{{ nfs_export_path }}"
    fstype: nfs
    opts: defaults,_netdev
    state: mounted

# STEP 5: Verify the mount is working
- name: Verify NFS mount
  command: df -h {{ nfs_mount_point }}
  register: mount_verify
  changed_when: false

- name: Display mount status
  debug:
    var: mount_verify.stdout_lines

# STEP 6: Test write access
- name: Test write access to NFS share
  copy:
    content: "NFS mount test from {{ inventory_hostname }} at {{ ansible_date_time.iso8601 }}\n"
    dest: "{{ nfs_mount_point }}/test_{{ inventory_hostname }}.txt"
    mode: '0644'
