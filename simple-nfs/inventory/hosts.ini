# ==========================================
# NFS Server (pick ONE node to be the server)
# ==========================================
[nfs_server]
haproxy-1 ansible_host=192.168.127.9 ansible_ssh_private_key_file=~/.ssh/k3s-keys/lb1.key

# ==========================================
# NFS Clients (all nodes that need to access shared storage)
# ==========================================
[nfs_clients]
master-1 ansible_host=192.168.127.10 ansible_ssh_private_key_file=~/.ssh/k3s-keys/m1.key
master-2 ansible_host=192.168.127.11 ansible_ssh_private_key_file=~/.ssh/k3s-keys/m2.key
master-3 ansible_host=192.168.127.12 ansible_ssh_private_key_file=~/.ssh/k3s-keys/m3.key
worker-1 ansible_host=192.168.127.20 ansible_ssh_private_key_file=~/.ssh/k3s-keys/w1.key
worker-2 ansible_host=192.168.127.21 ansible_ssh_private_key_file=~/.ssh/k3s-keys/w2.key

[all:vars]
ansible_user=vagrant
