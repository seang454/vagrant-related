master-2 ansible_host=192.168.127.11 ansible_ssh_private_key_file=~/.ssh/k3s-keys/m2.key
master-3 ansible_host=192.168.127.12 ansible_ssh_private_key_file=~/.ssh/k3s-keys/m3.key
worker-1 ansible_host=192.168.127.20 ansible_ssh_private_key_file=~/.ssh/k3s-keys/w1.key
