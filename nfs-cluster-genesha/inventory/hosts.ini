haproxy-2 ansible_host=192.168.127.15 ansible_ssh_private_key_file=~/.ssh/k3s-keys/lb2.key
haproxy-3 ansible_host=192.168.127.16 ansible_ssh_private_key_file=~/.ssh/k3s-keys/lb3.key

[nfs_clients]
